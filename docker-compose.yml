services:
  stackcoin:
    build: ./.
    image: jackharrhy/stackcoin
    env_file:
      - ./.env
    ports:
      - 127.0.0.1:3000:3000

  db:
    image: postgres:17
    env_file:
      - ./.env
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - db:/var/lib/postgresql/data

  hasura:
    image: hasura/graphql-engine:v2
    env_file:
      - ./.env
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      - db

volumes:
  db:
